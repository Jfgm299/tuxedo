version: 2
updates:
  # Keeps the SHA-pinned `uses:` refs in .github/workflows current. Dependabot
  # understands SHA pins and bumps both the SHA and its trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
